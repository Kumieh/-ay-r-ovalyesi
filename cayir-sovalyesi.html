const GUARD=[-.5,-1.7,0,.05,-.5,.3,.28],BLOCKP=[-.6,-1.6,0,0,-.1,.5,.42],STAG=[-.2,-.3,-.25,-.35,-.5,.3,.28];

function playerHit(){const f=fwd(),W=Wp();

else{e.hp-=W.dmg*(e.st==='rec'||e.st==='w'?1.3:1);e.kx=dx/d*9;e.kz=dz/d*9;shake(.35);snd('hit');sparks(ex,1.3,ez,8);if(e.hp>0){e.st='st';e.t=0;e.stn=.45;e.nr=false}else{score++;drop()}}}}}
function react(){for(const e of en){if(e.hp<=0)continue;const d=Math.hypot(P.x-e.m.position.x,P.z-e.m.position.z);
if(d<3.8&&(e.st==='c'||e.st==='r')&&rnd()<Math.min(.75,.25+.05*wave+.05*(ST.diff|0))){if(rnd()<.7){e.st='b';e.t=0;e.bt=.55+rnd()*.3}else{e.st='r';e.t=.2}}}}

function ai(e,dt){const m=e.m,o=m.o,dx=P.x-m.position.x,dz=P.z-m.position.z,d=Math.hypot(dx,dz)||1,ta=Math.atan2(dx,dz),nx=dx/d,nz=dz/d,sp=2.1+wave*.09;
e.t+=dt;let vx=0,vz=0,tr=4,tg=GUARD;const att=en.filter(q=>q.hp>0&&(q.st==='w'||q.st==='s')).length;

case'c':e.cd-=dt;e.sw-=dt;if(e.sw<=0){e.dir=-e.dir;e.sw=1.5+rnd()*2}

case'w':{const k=c01(e.t/e.wt);tr=2.4;if(d>2.5){vx=nx*1.6;vz=nz*1.6}tg=WIND(k);
if(e.fe&&k>.6){e.st='c';e.cd=.4+rnd()*.5;break}
if(e.t>=e.wt){e.st='s';e.t=0;e.hit=false;e.sd=Math.max(.13,.2-.012*wave)}break}
case's':{const k=c01(e.t/e.sd);tr=0;if(e.t<.1){vx=nx*3;vz=nz*3}tg=STRIKE(k);
if(!e.hit&&k>=.8){e.hit=true;if(d<3.1&&Math.abs(wr(ta-m.rotation.y))<.75)hurt(18,e)}
if(e.t>=e.sd){e.st='rec';e.t=0}break}
case'rec':tr=.8;tg=mix(STRIKE(1),GUARD,eo(c01(e.t/.6)));if(e.t>.6){e.st='c';e.cd=Math.max(.5,1.6-wave*.1)+rnd()*1.1}break;
case'b':tr=3;tg=BLOCKP;if(e.t>e.bt){e.st='c';e.cd=.3}break;
case'st':tr=0;tg=STAG;if(e.t>e.stn){e.st=e.nr?'c':'r';e.nr=false;e.t=0;e.cd=.4}break;
case'r':tr=3;vx=-nx*2.5;vz=-nz*2.5;if(e.t>.9){e.st='c';e.cd=.3+rnd()*.5}break}
m.rotation.y+=Math.max(-tr*dt,Math.min(tr*dt,wr(ta-m.rotation.y)));
const kk=Math.pow(.02,dt);m.position.x+=(vx+e.kx)*dt;m.position.z+=(vz+e.kz)*dt;e.kx*=kk;e.kz*=kk;
for(const q of en)if(q!==e&&q.hp>0){const ox=m.position.x-q.m.position.x,oz=m.position.z-q.m.position.z,od=Math.hypot(ox,oz);if(od<1.4&&od>.01){m.position.x+=ox/od*dt*2;m.position.z+=oz/od*dt*2}}
colRes(m.position,.5);m.position.y=hF(m.position.x,m.position.z);
const spd=Math.hypot(vx,vz);e.wa=lerp(e.wa,Math.min(1,spd/2),Math.min(1,dt*8));e.ph+=dt*spd*2.8;const ph=e.ph,wa=e.wa,q=(e.st==='w'||e.st==='s')?1:Math.min(1,dt*9);
for(let i=0;i<7;i++)e.p[i]=lerp(e.p[i],tg[i],q);
o.hL.rotation.x=-Math.sin(ph)*.65*wa;o.kL.rotation.x=Math.max(0,-Math.cos(ph))*wa;
o.hR.rotation.x=Math.sin(ph)*.65*wa;o.kR.rotation.x=Math.max(0,Math.cos(ph))*wa;
o.pel.position.y=1.07-Math.abs(Math.cos(ph))*.04*wa;o.pel.rotation.z=Math.sin(ph)*.05*wa;
o.tor.rotation.y=e.p[2]+Math.sin(ph)*.12*wa;o.tor.rotation.x=e.p[3]+.06*wa+Math.sin(time*1.6+e.ph)*.012;o.hd.rotation.y=-Math.sin(ph)*.08*wa+wr(ta-m.rotation.y)*.4;
o.sR.rotation.x=e.p[0]+Math.sin(ph)*.1*wa;o.eR.rotation.x=e.p[1];o.sL.rotation.x=-.9+Math.sin(ph)*.12*wa;o.eL.rotation.x=-1.3;
o.shd.position.set(e.p[4],e.p[5],e.p[6]);o.ck.rotation.x=.12+wa*.4+(e.st==='st'?.5:0)+Math.sin(time*3+e.ph)*.05}

const SW=.22,SS=.13,SF=.12,SR=.33,IDLE=[.5,-.5,-.75,-.35,0,-.25],BLK=[.35,-.25,-.7,-.1,0,0],SP=IDLE.slice(),SHI=[-.62,-.5,-.75,-.2,.5],SHB=[-.2,-.18,-.65,-.1,0],SHP=SHI.slice();
const WN=[[.78,-.18,-.55,-.1,-.15,-1.15],[.1,-.25,-.6,-.1,.2,1.1]],EN=[[-.15,-.62,-.9,-1.15,.25,1.15],[.75,-.6,-.9,-1,-.25,-1.15]],FL=[[-.3,-.55,-.8,-.9,.3,1.35],[.85,-.55,-.8,-.9,-.3,-1.3]];
function swordPose(t,sd){const i=sd>0?0:1;if(t<SW)return mix(IDLE,WN[i],eo(t/SW));t-=SW;if(t<SS)return mix(WN[i],EN[i],ei(t/SS));t-=SS;if(t<SF)return mix(EN[i],FL[i],eo(t/SF));t-=SF;return mix(FL[i],IDLE,eo(c01(t/SR)))}
let hot=false;

function update(dt){time+=dt;GU.t.value=time;if(P.stun>0)P.stun-=dt;const W=Wp();
yaw+=((K.ArrowLeft?1:0)-(K.ArrowRight?1:0))*1.9*dt;pitch=Math.max(-1.1,Math.min(1.1,pitch+((K.ArrowUp?1:0)-(K.ArrowDown?1:0))*1.2*dt));
const stn=P.stun>0,my=(K.KeyW?1:0)-(K.KeyS?1:0)-I.jy,mx=(K.KeyD?1:0)-(K.KeyA?1:0)+I.jx,l=Math.hypot(mx,my);
if(l>.05){const k=Math.min(1,l),s=5*dt*k/l*(P.swing>=0||stn?.45:1),f=fwd();P.x+=(f[0]*my+Math.cos(yaw)*mx)*s;P.z+=(f[1]*my-Math.sin(yaw)*mx)*s;const r=Math.hypot(P.x,P.z);if(r>LIM){P.x*=LIM/r;P.z*=LIM/r}colRes(P,.4)}
P.block=I.b&&P.st>0&&P.swing<0&&!stn;P.blockT=P.block?P.blockT+dt:0;
if(I.a&&P.swing<0&&!P.block&&!stn&&P.st>=15){P.swing=0;P.hit=false;P.st=Math.max(0,P.st-W.cost);P.sd=-P.sd;P.dly=.7;snd('swing');react()}
if(P.swing>=0){P.swing+=dt/W.spd;if(!P.hit&&P.swing>=SW+SS*.6){P.hit=true;playerHit()}if(P.swing>=SW+SS+SF+SR)P.swing=-1}
if(P.block)P.st-=5*dt;else if(P.dly>0)P.dly-=dt;else P.st=Math.min(100,P.st+16*(Ar().heavy?.75:1)*dt);if(P.st<0)P.st=0;
const tgt=P.swing>=0?swordPose(P.swing,P.sd):P.block?BLK:IDLE,q=P.swing>=0?1:Math.min(1,dt*14),sq=Math.min(1,dt*12),st2=P.block?SHB:SHI;
for(let i=0;i<6;i++)SP[i]=lerp(SP[i],tgt[i],q);for(let i=0;i<5;i++)SHP[i]=lerp(SHP[i],st2[i],sq);
const mv=l>.05?Math.min(1,l):0,bb=ST.bob?1:0;bobA=lerp(bobA,mv,Math.min(1,dt*8));bobT+=dt*mv*8;
const dyw=yaw-pyaw;pyaw=yaw;lag=lerp(lag,Math.max(-.35,Math.min(.35,dyw*5)),Math.min(1,dt*10));
swP.position.set(SP[0],SP[1]-Math.abs(Math.sin(bobT))*.03*bobA*bb,SP[2]);swP.rotation.set(SP[3],SP[4]+lag+Math.sin(bobT)*.05*bobA*bb,SP[5]);
shP.position.set(SHP[0],SHP[1]-Math.abs(Math.sin(bobT+.6))*.025*bobA*bb,SHP[2]);shP.rotation.set(SHP[3],SHP[4]-lag*.6,0);
for(const e of en){if(e.hp<=0){e.dead+=dt;e.m.rotation.x=-Math.min(1.55,e.dead*3.5);continue}ai(e,dt)}
en=en.filter(e=>{if(e.dead>2.4){S.remove(e.m);return false}return true});
if(!en.some(e=>e.hp>0)&&next===0)next=time+2.5;
if(next&&time>next){next=0;wave++;P.hp=Math.min(100,P.hp+20);startWave()}
$('hp').firstChild.style.width=P.hp+'%';$('st').firstChild.style.width=P.st+'%';
const f=fwd();let h=false;for(const e of en){if(e.hp<=0)continue;const dx=e.m.position.x-P.x,dz=e.m.position.z-P.z,d=Math.hypot(dx,dz);if(d<2.6+.6*W.len&&(f[0]*dx+f[1]*dz)/d>.5){h=true;break}}
if(h!==hot){hot=h;$('xh').classList.toggle('hot',h)}
for(let j=0;j<SPN;j++)if(spL[j]>0){spL[j]-=dt;spV[j*3+1]-=9*dt;spP[j*3]+=spV[j*3]*dt;spP[j*3+1]+=spV[j*3+1]*dt;spP[j*3+2]+=spV[j*3+2]*dt;if(spL[j]<=0)spP[j*3+1]=-999}spGeo.attributes.position.needsUpdate=true;
for(let j=0;j<PN;j++){const i=j*3;pPos[i]+=Math.sin(time*.7+j)*dt*.4;pPos[i+1]+=Math.cos(time*.9+j*1.7)*dt*.25+dt*.1;pPos[i+2]+=Math.cos(time*.5+j*2.3)*dt*.4;
if(Math.abs(pPos[i]-C.position.x)>16||Math.abs(pPos[i+2]-C.position.z)>16||pPos[i+1]>6||pPos[i+1]<0){pPos[i]=C.position.x+(rnd()-.5)*30;pPos[i+1]=.3+rnd()*4;pPos[i+2]=C.position.z+(rnd()-.5)*30}}pGeo.attributes.position.needsUpdate=true;
const kick=P.swing>=SW?Math.sin(c01((P.swing-SW)/(SS+SF))*Math.PI):0,sw=Math.cos(bobT)*.04*bobA*bb;shk*=Math.pow(.003,dt);
C.position.set(P.x+Math.cos(yaw)*sw+f[0]*kick*.28+(rnd()-.5)*shk*.1,hF(P.x,P.z)+1.7+(Math.abs(Math.sin(bobT))*.09-.045)*bobA*bb+(rnd()-.5)*shk*.1,P.z-Math.sin(yaw)*sw+f[1]*kick*.28);
C.rotation.set(pitch-kick*.05,yaw,Math.sin(bobT)*.012*bobA*bb+P.sd*kick*.04+(rnd()-.5)*shk*.03);
sun.position.set(P.x+44,56,P.z+30);sun.target.position.set(P.x,0,P.z)}
